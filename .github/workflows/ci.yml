name: CI

# The ticket routines work on draft PRs and mark them ready when done, so CI
# runs on ready PRs only (and on pushes to main). ready_for_review re-triggers
# the run when a draft is marked ready.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # One command, same as the worker brief: typecheck, lint, validate, build, format check.
      - run: npm run typecheck && npm run lint && npm run validate && npm run build && npm run format:check
