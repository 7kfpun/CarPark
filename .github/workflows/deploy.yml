name: Deploy

# One release a day: merged PRs accumulate on main and go live at 07:00 Taipei
# (23:00 UTC). Run the workflow by hand for an out-of-band release.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # Same gate as CI, so a broken main never goes live.
      - run: npm run typecheck && npm run lint && npm run format:check && npm run validate && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
